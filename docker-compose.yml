services:
  app:
    build: .
    image: ugram-backend
    environment:
      - APP_ENV=development
      - DATABASE_MODE=local
      - AWS_SDK_LOAD_CONFIG=true
    volumes:
      - .:/app
      - /app/.venv
      - ${USERPROFILE}/.aws:/root/.aws:ro
    # If/when you switch to a web server, uncomment ports:
    ports:
      - "8001:8001"
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload
