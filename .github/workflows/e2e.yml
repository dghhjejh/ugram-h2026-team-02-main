name: E2E Tests

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          uv sync --dev
          cd frontend && npx -y pnpm install

      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Start Database
        run: docker compose -f backend/docker-compose.yml up -d db

      - name: Run Playwright tests
        env:
          SECRET_KEY: "ci-secret-key-not-for-production-use" # pragma: allowlist secret
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          DATABASE_MODE: "local"
          LOCAL_DATABASE_URL: "postgresql://user:pass@localhost:5433/ugram" # pragma: allowlist secret
        run: |
          # Start backend in background
          cd backend && uv run uvicorn src.main:app --port 8001 &
          # Wait for backend to be ready
          npx wait-on http://localhost:8001/docs
          # Run E2E tests
          cd frontend && npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
