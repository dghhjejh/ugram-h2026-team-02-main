services:
  api:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DATABASE_MODE=local
      - LOCAL_DATABASE_URL=postgresql://user:pass@db:5432/ugram
  db:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=ugram
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
